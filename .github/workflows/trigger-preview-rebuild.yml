name: Trigger preview rebuild once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-preview-rebuild.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch preview after CI disk cleanup fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-preview.yml --repo "$GITHUB_REPOSITORY" --ref main
