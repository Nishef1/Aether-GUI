name: Build Android ARM64 APK

on:
  workflow_dispatch:

concurrency:
  group: android-arm64-manual
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_MIN_API: "29"
  HEV_SOCKS5_TUNNEL_COMMIT: "da33382c7282b4e764408535704f3cd96fea9a14"
  VITE_AETHER_PLATFORM: android

jobs:
  build:
    name: Android arm64-v8a debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out GUI and pinned Aether core
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Initialize build diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "gui_commit=$(git rev-parse HEAD)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "android_api=${ANDROID_API}"
            echo "android_min_api=${ANDROID_MIN_API}"
            echo "android_ndk=${ANDROID_NDK_VERSION}"
            echo
            echo "Submodules:"
            git submodule status --recursive
          } | tee build-logs/build-context.txt

      - name: Run Android plugin source contract tests
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Run Android plugin source contract tests" \
            "android-plugin-contract-tests.log" \
            python3 scripts/tests/test_android_plugin_contract.py

      - name: Install native build prerequisites
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Install native build prerequisites" \
            "native-prerequisites.log" \
            bash -lc '
              set -euo pipefail
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends \
                clang \
                cmake \
                libclang-dev \
                nasm \
                ninja-build \
                perl
            '

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Install Android SDK and NDK" \
            "android-sdk.log" \
            bash -lc '
              set -euo pipefail
              yes | sdkmanager --licenses >/dev/null || true
              sdkmanager \
                "platform-tools" \
                "platforms;android-${ANDROID_API}" \
                "build-tools;${ANDROID_BUILD_TOOLS}" \
                "ndk;${ANDROID_NDK_VERSION}"
              echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
              echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
            '

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Install JavaScript dependencies" \
            "pnpm-install.log" \
            pnpm install --frozen-lockfile

      - name: Set up Rust 1.88 for Android
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            vendor/aether/aether -> target
          cache-on-failure: true

      - name: Install cargo-ndk 4.1.2
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Install cargo-ndk 4.1.2" \
            "cargo-ndk-install.log" \
            cargo install cargo-ndk --version 4.1.2 --locked

          {
            rustc -Vv
            cargo -V
            cargo ndk -V
            java -version
          } 2>&1 | tee -a build-logs/build-context.txt

      - name: Build Aether core for arm64-v8a
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Build Aether core for arm64-v8a" \
            "aether-core.log" \
            bash scripts/ci/build-aether-android.sh

      - name: Build pinned hev-socks5-tunnel for arm64-v8a
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Build pinned hev-socks5-tunnel for arm64-v8a" \
            "hev-socks5-tunnel.log" \
            bash scripts/ci/build-hev-android.sh

      - name: Generate the Tauri Android project
        shell: bash
        env:
          CI: "true"
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Generate the Tauri Android project" \
            "tauri-android-init.log" \
            pnpm tauri android init --ci --skip-targets-install

      - name: Compile Android plugin Kotlin preflight
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Compile Android plugin Kotlin preflight" \
            "android-plugin-kotlin-preflight.log" \
            bash scripts/ci/test-android-plugin-kotlin.sh

      - name: Force extracted native-library packaging
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Force extracted native-library packaging" \
            "native-packaging.log" \
            python3 scripts/ci/patch-android-packaging.py

      - name: Bundle ARM64 native components
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Bundle ARM64 native components" \
            "native-bundle.log" \
            bash scripts/ci/bundle-android-native.sh

      - name: Build a directly installable ARM64 debug APK
        shell: bash
        env:
          CI: "true"
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Build a directly installable ARM64 debug APK" \
            "tauri-android-build.log" \
            pnpm tauri android build \
              --debug \
              --apk \
              --target aarch64 \
              --split-per-abi

      - name: Collect APK and checksums
        shell: bash
        run: |
          bash scripts/ci/run-with-diagnostics.sh \
            "Collect APK and checksums" \
            "collect-artifacts.log" \
            bash -lc '
              set -euo pipefail
              mkdir -p artifacts
              mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | sort)
              test "${#apks[@]}" -gt 0
              for apk in "${apks[@]}"; do
                cp "$apk" "artifacts/$(basename "$apk")"
              done
              cp THIRD_PARTY_NOTICES.md artifacts/
              printf "%s  %s\n" \
                "${HEV_SOCKS5_TUNNEL_COMMIT}" \
                "hev-socks5-tunnel" \
                > artifacts/NATIVE_SOURCES.txt
              (
                cd artifacts
                sha256sum *.apk > SHA256SUMS.txt
              )
              ls -lh artifacts
            '

      - name: Write concise diagnostic summary
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build-logs
          {
            echo "# Android ARM64 build diagnostics"
            echo
            echo "- Run: ${GITHUB_RUN_ID}"
            echo "- Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Commit: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo
            if [[ -f build-logs/failure-summary.txt ]]; then
              echo "## Captured failure"
              echo '```text'
              cat build-logs/failure-summary.txt
              echo '```'
            else
              echo "No wrapped command failed. Complete per-step logs are attached in the diagnostics artifact."
            fi
            echo
            echo "## Captured files"
            find build-logs -maxdepth 1 -type f -printf '%f\n' | sort
          } | tee build-logs/job-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Android-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/**
          if-no-files-found: warn

      - name: Upload Android ARM64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Android-arm64-v8a
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
