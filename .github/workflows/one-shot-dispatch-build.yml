name: One-shot dispatch verified build

on:
  push:
    paths:
      - '.github/workflows/one-shot-dispatch-build.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove dispatcher from final main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-dispatch-build.yml
          git commit -m 'chore: remove one-shot build dispatcher'
          git push origin HEAD:main
      - name: Dispatch platform build on final main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_release=true
