name: Build Linux preview once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-linux-preview-once.yml

permissions:
  contents: write
  statuses: write

env:
  PREVIEW_TAG: preview-v0.5.2-multiplatform

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark Linux build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context='preview/linux-x86_64' \
            -f description='Building unsigned Linux x64 preview' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native and bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-dev cmake nasm curl wget file unzip \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2

      - run: pnpm install --frozen-lockfile

      - name: Build and stage pinned Aether fork
        run: |
          set -euo pipefail
          cargo build --release --manifest-path vendor/aether/aether/Cargo.toml
          source_binary="vendor/aether/aether/target/release/aether"
          test -s "$source_binary"
          commit="$(git -C vendor/aether rev-parse --short=12 HEAD)"
          version="dev-$commit"
          mkdir -p src-tauri/binaries
          rm -f src-tauri/binaries/aether src-tauri/binaries/aether-dev-*
          install -m 0755 "$source_binary" "src-tauri/binaries/aether-$version"
          cp "src-tauri/binaries/aether-$version" src-tauri/binaries/aether
          chmod 0755 src-tauri/binaries/aether
          printf '%s' "$version" > src-tauri/binaries/aether-version.txt

      - name: Fetch verified TUN cores
        run: |
          set -euo pipefail
          bash src-tauri/binaries/fetch-singbox.sh --version v1.13.14
          bash src-tauri/binaries/fetch-xray.sh --version v26.6.1
          file src-tauri/binaries/aether src-tauri/binaries/sing-box src-tauri/binaries/xray

      - name: Build Linux bundles with captured log
        id: bundle
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm tauri build --bundles appimage,deb,rpm --config src-tauri/tauri.conf.unsigned.json 2>&1 | tee linux-build.log

      - name: Upload Linux build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-gui-linux-build-log
          retention-days: 14
          path: linux-build.log

      - name: Fail after preserving build log
        if: steps.bundle.outcome == 'failure'
        run: exit 1

      - name: Create checksums
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"
          mapfile -d '' files < <(find "$bundle_dir" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 | sort -z)
          test "${#files[@]}" -gt 0
          checksum="$bundle_dir/aether-gui-linux-x86_64-SHA256SUMS.txt"
          : > "$checksum"
          for file in "${files[@]}"; do
            hash="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$(basename "$file")" >> "$checksum"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-gui-linux-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/aether-gui-linux-x86_64-SHA256SUMS.txt

      - name: Publish preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"
          mapfile -d '' files < <(find "$bundle_dir" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name 'aether-gui-linux-x86_64-SHA256SUMS.txt' \) -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$PREVIEW_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Mark Linux build success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context='preview/linux-x86_64' \
            -f description='Unsigned Linux x64 previews are ready' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$PREVIEW_TAG"

      - name: Mark Linux build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure -f context='preview/linux-x86_64' \
            -f description='Unsigned Linux x64 preview failed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
