name: npm-lock-once

on:
  push:
    branches: [main]

concurrency:
  group: npm-lock-once
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Regenerate dependency metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply non-breaking production security fixes
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts

      - name: Verify reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Commit lockfile only
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh audited npm lockfile"
          git push origin HEAD:main
