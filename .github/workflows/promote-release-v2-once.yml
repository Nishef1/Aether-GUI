name: Promote v0.5.2 release once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-release-v2-once.yml

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-22.04
    env:
      OLD_TAG: preview-v0.5.2-multiplatform
      NEW_TAG: v0.5.2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark promotion pending
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='release/promotion-v2' \
            -f description='Publishing Aether-GUI v0.5.2 as a regular release' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Promote existing release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            current_tag="$NEW_TAG"
          elif gh release view "$OLD_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            current_tag="$OLD_TAG"
          else
            echo "Neither $OLD_TAG nor $NEW_TAG release exists" >&2
            exit 1
          fi

          cat > release-notes.md <<'EOF'
          ## Aether-GUI v0.5.2

          Desktop builds are available for:
          - Windows x64 (`.exe` and `.msi`)
          - Linux x64 (`.AppImage`, `.deb`, and `.rpm`)
          - macOS Apple Silicon (`.dmg`)
          - macOS Intel (`.dmg`)

          The pinned custom Aether core, sing-box, and Xray resources are bundled with the application. SHA-256 checksum files are included for every platform.

          ### Unsigned build notice
          These builds are intentionally unsigned. Windows SmartScreen and macOS Gatekeeper may display security warnings. macOS packages use ad-hoc signing and are not notarized.
          EOF

          sed -i 's/^          //' release-notes.md

          gh release edit "$current_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$NEW_TAG" \
            --title "Aether-GUI v0.5.2" \
            --notes-file release-notes.md \
            --draft=false \
            --prerelease=false \
            --latest

          gh release view "$NEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,url,assets \
            --jq 'select(.tagName == "v0.5.2" and .name == "Aether-GUI v0.5.2" and .isDraft == false and .isPrerelease == false and (.assets | length) > 0) | .url'

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$OLD_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$OLD_TAG"
          fi

      - name: Mark promotion success
        if: success()
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context='release/promotion-v2' \
            -f description='Aether-GUI v0.5.2 is a regular Latest release' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$NEW_TAG"

      - name: Mark promotion failure
        if: failure()
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context='release/promotion-v2' \
            -f description='Regular release promotion failed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
