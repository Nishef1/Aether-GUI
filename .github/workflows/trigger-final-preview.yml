name: Trigger final preview audit once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-final-preview.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch hardened preview workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-preview.yml --repo "$GITHUB_REPOSITORY" --ref main
