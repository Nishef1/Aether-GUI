name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized app versions
        run: pnpm verify:version

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Rust check
        shell: pwsh
        run: |
          pnpm check:rust *>&1 | Tee-Object -FilePath rust-check.log
          exit $LASTEXITCODE

      - name: Upload Rust check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-check-diagnostics
          path: rust-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Rust tests
        run: pnpm test:rust

      - name: Clippy
        run: pnpm clippy:rust

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
