name: Build unsigned desktop previews

on:
  # This path-limited push trigger runs preview builds only when this workflow
  # itself changes. Ordinary source commits and pull requests do not run it.
  push:
    branches: [main]
    paths:
      - .github/workflows/build-preview.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PREVIEW_TAG: preview-v0.5.2-multiplatform

jobs:
  prepare-release:
    name: Prepare preview release
    runs-on: ubuntu-22.04
    steps:
      - name: Recreate preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$PREVIEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Aether-GUI 0.5.2 unsigned multi-platform preview" \
            --notes "Unsigned test builds from the pinned custom Aether core. Windows and macOS may show operating-system security warnings. These files are previews and are not used by the in-app updater."

  build:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: aether-gui-windows-x86_64
            platform: windows
          - name: Linux x64
            os: ubuntu-22.04
            artifact: aether-gui-linux-x86_64
            platform: linux
          - name: macOS Apple Silicon
            os: macos-15
            artifact: aether-gui-macos-arm64
            platform: macos
          - name: macOS Intel
            os: macos-15-intel
            artifact: aether-gui-macos-x86_64
            platform: macos

    steps:
      - name: Check out GUI and pinned Aether fork
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-dev cmake nasm curl wget file unzip \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Install macOS native build dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install llvm cmake nasm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows native build dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and stage Windows cores
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pnpm prepare:cores:windows

      - name: Build and stage pinned Aether fork
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path vendor/aether/aether/Cargo.toml
          source_binary="vendor/aether/aether/target/release/aether"
          test -s "$source_binary"

          commit="$(git -C vendor/aether rev-parse --short=12 HEAD)"
          version="dev-$commit"
          mkdir -p src-tauri/binaries
          rm -f src-tauri/binaries/aether src-tauri/binaries/aether-dev-*
          install -m 0755 "$source_binary" "src-tauri/binaries/aether-$version"
          cp "src-tauri/binaries/aether-$version" src-tauri/binaries/aether
          chmod 0755 src-tauri/binaries/aether
          printf '%s' "$version" > src-tauri/binaries/aether-version.txt

      - name: Fetch and verify Unix TUN cores
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          bash src-tauri/binaries/fetch-singbox.sh --version v1.13.14
          bash src-tauri/binaries/fetch-xray.sh --version v26.6.1
          file src-tauri/binaries/aether src-tauri/binaries/sing-box src-tauri/binaries/xray

      - name: Build unsigned Windows bundles
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pnpm tauri build --bundles nsis,msi --config src-tauri/tauri.conf.unsigned.json

      - name: Build unsigned Linux bundles
        if: matrix.platform == 'linux'
        run: pnpm tauri build --bundles appimage,deb,rpm --config src-tauri/tauri.conf.unsigned.json

      - name: Build ad-hoc signed macOS DMG
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --bundles dmg --config src-tauri/tauri.conf.unsigned.json

      - name: Create Windows checksums
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundleDir = 'src-tauri/target/release/bundle'
          $files = Get-ChildItem $bundleDir -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') } |
            Sort-Object FullName
          if (-not $files) { throw 'No Windows bundles were produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding utf8NoBOM "$bundleDir/${{ matrix.artifact }}-SHA256SUMS.txt"

      - name: Create Unix checksums
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"
          mapfile -d '' files < <(find "$bundle_dir" -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 | sort -z)
          test "${#files[@]}" -gt 0
          checksum="$bundle_dir/${{ matrix.artifact }}-SHA256SUMS.txt"
          : > "$checksum"
          for file in "${files[@]}"; do
            if command -v sha256sum >/dev/null 2>&1; then
              hash="$(sha256sum "$file" | awk '{print $1}')"
            else
              hash="$(shasum -a 256 "$file" | awk '{print $1}')"
            fi
            printf '%s  %s\n' "$hash" "$(basename "$file")" >> "$checksum"
          done

      - name: Upload Windows workflow artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/${{ matrix.artifact }}-SHA256SUMS.txt

      - name: Upload Linux workflow artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/${{ matrix.artifact }}-SHA256SUMS.txt

      - name: Upload macOS workflow artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/${{ matrix.artifact }}-SHA256SUMS.txt

      - name: Publish Windows preview assets
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundleDir = 'src-tauri/target/release/bundle'
          $upload = @(
            Get-ChildItem "$bundleDir/nsis" -Filter '*.exe' -File
            Get-ChildItem "$bundleDir/msi" -Filter '*.msi' -File
            Get-Item "$bundleDir/${{ matrix.artifact }}-SHA256SUMS.txt"
          ) | ForEach-Object { $_.FullName }
          & gh release upload $env:PREVIEW_TAG @upload --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed with exit code $LASTEXITCODE" }

      - name: Publish Unix preview assets
        if: matrix.platform != 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"
          mapfile -d '' files < <(find "$bundle_dir" -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '${{ matrix.artifact }}-SHA256SUMS.txt' \) -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$PREVIEW_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
