name: Build unsigned desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version tag to release (for example v0.5.7)"
        required: true
        type: string

concurrency:
  group: unsigned-desktop-release
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  prepare-release:
    name: Prepare desktop release
    runs-on: ubuntu-22.04
    steps:
      - name: Mark release build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='release/multiplatform' \
            -f description='Unsigned desktop release build is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Recreate desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Aether-GUI $RELEASE_TAG" \
            --generate-notes

  build:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # The core installers use authenticated GitHub API/download requests on
      # hosted runners to avoid sharing the anonymous rate limit across jobs.
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: aether-gui-windows-x86_64
            platform: windows
          - name: Linux x64
            os: ubuntu-22.04
            artifact: aether-gui-linux-x86_64
            platform: linux
          - name: macOS Apple Silicon
            os: macos-15
            artifact: aether-gui-macos-arm64
            platform: macos
          - name: macOS Intel
            os: macos-15-intel
            artifact: aether-gui-macos-x86_64
            platform: macos

    steps:
      - name: Check out GUI and pinned Aether fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-dev cmake nasm curl wget file unzip \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2

      - name: Install macOS native build dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install llvm cmake nasm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows native build dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and stage Windows cores
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pnpm prepare:cores:windows

      - name: Build and stage pinned Aether fork
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path vendor/aether/aether/Cargo.toml
          source_binary="vendor/aether/aether/target/release/aether"
          test -s "$source_binary"

          commit="$(git -C vendor/aether rev-parse --short=12 HEAD)"
          version="dev-$commit"
          mkdir -p src-tauri/binaries
          rm -f src-tauri/binaries/aether src-tauri/binaries/aether-dev-*
          install -m 0755 "$source_binary" "src-tauri/binaries/aether-$version"
          cp "src-tauri/binaries/aether-$version" src-tauri/binaries/aether
          chmod 0755 src-tauri/binaries/aether
          printf '%s' "$version" > src-tauri/binaries/aether-version.txt

      - name: Fetch and verify Unix TUN cores
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          bash src-tauri/binaries/fetch-singbox.sh --version v1.13.14
          bash src-tauri/binaries/fetch-xray.sh --version v26.6.1
          file src-tauri/binaries/aether src-tauri/binaries/sing-box src-tauri/binaries/xray

      - name: Build unsigned Windows bundles
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pnpm tauri build --bundles nsis,msi --config src-tauri/tauri.conf.unsigned.json

      - name: Build unsigned Linux bundles
        if: matrix.platform == 'linux'
        run: pnpm tauri build --bundles appimage,deb,rpm --config src-tauri/tauri.conf.unsigned.json

      - name: Build ad-hoc signed macOS DMG
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --bundles dmg --config src-tauri/tauri.conf.unsigned.json

      - name: Create Windows checksums
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundleDir = 'src-tauri/target/release/bundle'
          $files = Get-ChildItem $bundleDir -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') } |
            Sort-Object FullName
          if (-not $files) { throw 'No Windows bundles were produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding utf8NoBOM "$bundleDir/${{ matrix.artifact }}-SHA256SUMS.txt"

      - name: Create Unix checksums
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find "$bundle_dir" -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print | sort)
          test "${#files[@]}" -gt 0
          checksum="$bundle_dir/${{ matrix.artifact }}-SHA256SUMS.txt"
          : > "$checksum"
          for file in "${files[@]}"; do
            if command -v sha256sum >/dev/null 2>&1; then
              hash="$(sha256sum "$file" | awk '{print $1}')"
            else
              hash="$(shasum -a 256 "$file" | awk '{print $1}')"
            fi
            printf '%s  %s\n' "$hash" "$(basename "$file")" >> "$checksum"
          done

      - name: Upload Windows workflow artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/${{ matrix.artifact }}-SHA256SUMS.txt

      - name: Upload Linux workflow artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/${{ matrix.artifact }}-SHA256SUMS.txt

      - name: Upload macOS workflow artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/${{ matrix.artifact }}-SHA256SUMS.txt

      - name: Publish Windows release assets
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundleDir = 'src-tauri/target/release/bundle'
          $upload = @(
            Get-ChildItem "$bundleDir/nsis" -Filter '*.exe' -File
            Get-ChildItem "$bundleDir/msi" -Filter '*.msi' -File
            Get-Item "$bundleDir/${{ matrix.artifact }}-SHA256SUMS.txt"
          ) | ForEach-Object { $_.FullName }
          & gh release upload $env:RELEASE_TAG @upload --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed with exit code $LASTEXITCODE" }

      - name: Publish Unix release assets
        if: matrix.platform != 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find "$bundle_dir" -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '${{ matrix.artifact }}-SHA256SUMS.txt' \) -print | sort)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  finalize:
    name: Finalize release status
    needs:
      - prepare-release
      - build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Publish final commit status
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          case "$BUILD_RESULT" in
            success)
              state=success
              description='All unsigned desktop release builds succeeded'
              ;;
            cancelled)
              state=error
              description='Unsigned desktop release build was cancelled'
              ;;
            *)
              state=failure
              description='One or more desktop release builds failed'
              ;;
          esac
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='release/multiplatform' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
