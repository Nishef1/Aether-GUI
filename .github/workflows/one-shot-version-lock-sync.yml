name: One-shot product version lock sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-version-lock-sync.yml"

permissions:
  contents: write

jobs:
  sync-lock-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize product version metadata
        run: node scripts/ci/sync-product-version.mjs

      - name: Verify only expected lock metadata changed
        shell: bash
        run: |
          git diff --exit-code -- package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          python - <<'PY'
          import subprocess
          import sys

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "--", "package-lock.json", "src-tauri/Cargo.lock"],
              text=True,
          )
          changed = [
              line for line in diff.splitlines()
              if line.startswith(("+", "-")) and not line.startswith(("+++", "---"))
          ]
          allowed = {
              '"version": "0.7.2",',
              '"version": "1.0.0",',
              'version = "0.7.2"',
              'version = "1.0.0"',
          }
          bad = [line for line in changed if line[1:].strip() not in allowed]
          if bad:
              print("Unexpected lockfile changes:\n" + "\n".join(bad), file=sys.stderr)
              sys.exit(1)

          expected_counts = {
              '-"version": "0.7.2",': 2,
              '+"version": "1.0.0",': 2,
              '-version = "0.7.2"': 1,
              '+version = "1.0.0"': 1,
          }
          normalized = [line[0] + line[1:].strip() for line in changed]
          for needle, count in expected_counts.items():
              actual = normalized.count(needle)
              if actual != count:
                  print(f"Expected {count} occurrences of {needle!r}, got {actual}", file=sys.stderr)
                  print(diff, file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Commit synchronized lock metadata and self-remove
        shell: bash
        run: |
          rm .github/workflows/one-shot-version-lock-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock .github/workflows/one-shot-version-lock-sync.yml
          git diff --cached --check
          git commit -m "build: sync product version lock metadata"
          git push origin HEAD:main
