name: One-shot fix Arch CMake dependency

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-arch-cmake.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add CMake to Arch package and CI build environment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pkg = Path('packaging/arch/PKGBUILD')
          s = pkg.read_text()
          old = "  'rust'\n  'openssl'"
          new = "  'rust'\n  'cmake'\n  'openssl'"
          if s.count(old) != 1:
              raise SystemExit('unexpected PKGBUILD makedepends shape')
          pkg.write_text(s.replace(old, new))

          wf = Path('.github/workflows/build.yml')
          s = wf.read_text()
          old = 'git curl wget file nodejs npm rust openssl librsvg xdotool patchelf \\\n            webkit2gtk-4.1 gtk3 libayatana-appindicator polkit'
          new = 'git curl wget file nodejs npm rust cmake openssl librsvg xdotool patchelf \\\n            webkit2gtk-4.1 gtk3 libayatana-appindicator polkit'
          if s.count(old) != 1:
              raise SystemExit('unexpected Arch CI dependency shape')
          wf.write_text(s.replace(old, new))
          PY
          grep -A15 '^makedepends=(' packaging/arch/PKGBUILD | grep -q "'cmake'"
          grep -q 'nodejs npm rust cmake openssl' .github/workflows/build.yml
      - name: Commit verified Arch dependency fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-fix-arch-cmake.yml
          git add .github/workflows/build.yml packaging/arch/PKGBUILD
          git commit -m 'build: install CMake for Arch custom Core builds'
          git push origin HEAD:main
