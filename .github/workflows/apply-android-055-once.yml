name: Apply Android 0.5.5 runtime once

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Android ARM64 APK
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: android-055-one-shot
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.id == 30214677233
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Apply and verify runtime hardening
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 scripts/tests/test_android_transport_patcher.py
          python3 scripts/ci/apply-android-wireguard-policy.py
          python3 scripts/tests/test_android_transport_contract.py
          python3 scripts/tests/test_android_disconnect_contract.py

      - name: Commit the real Android service source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/plugins/aether-vpn/android/src/main/java/FinalAetherVpnPlugin.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix(android): verify WG egress and serialize native disconnect"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch and record Android 0.5.5 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-android-arm64.yml --repo "${GITHUB_REPOSITORY}" --ref main
          sleep 12
          gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow build-android-arm64.yml \
            --limit 1 \
            --json databaseId,url,status,conclusion,headSha,createdAt \
            > .github/android-055-build.json
          git add .github/android-055-build.json
          git commit -m "ci(android): record 0.5.5 runtime build"
          git pull --rebase origin main
          git push origin HEAD:main
