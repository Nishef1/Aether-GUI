name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.7.2
  RELEASE_TAG: v0.7.2

permissions:
  contents: read

jobs:
  mark:
    name: start platform build
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Mark platform build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=aether/build \
            -f description='Building desktop and Android artifacts' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  desktop:
    needs: mark
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            aether_asset: aether-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            aether_asset: aether-windows-x86_64.zip
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            aether_asset: aether-macos-arm64.tar.gz
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            aether_asset: aether-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=moderate

      - name: Fetch official Aether core
        if: runner.os != 'Windows'
        env:
          AETHER_ASSET: ${{ matrix.aether_asset }}
        run: bash src-tauri/binaries/fetch-aether.sh

      - name: Fetch official Aether core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "v1.5.0"
          $asset = "${{ matrix.aether_asset }}"
          $base = "https://github.com/CluvexStudio/Aether/releases/download/$version"
          Invoke-WebRequest "$base/$asset" -OutFile $asset
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          $line = Get-Content SHA256SUMS.txt | Where-Object { $_ -match [regex]::Escape($asset) } | Select-Object -First 1
          if (-not $line) { throw "Aether checksum entry was not found" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Aether checksum mismatch" }
          Expand-Archive $asset -DestinationPath aether-extract
          Copy-Item aether-extract/aether.exe src-tauri/binaries/aether.exe

      - name: Prepare pinned sing-box sidecar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:sidecars

      - name: TypeScript typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Android feature-parity contracts
        if: runner.os == 'Linux'
        run: python3 scripts/tests/test_android_feature_parity.py

      - name: Rust formatting check
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust unit tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build desktop bundle
        run: npm run tauri -- build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: aether-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*setup.exe

  android:
    needs: mark
    name: android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_MIN_API: 29
      NDK_VERSION: 28.2.13676358

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and pinned NDK
        run: |
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund

      - name: Initialize generated Android project
        run: npm run android:init

      - name: Validate Android release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required Android release signing secret: $name" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          done

      - name: Configure temporary Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/ci/configure-android-release-signing.mjs

      - name: Prepare verified Aether and HEV ARM64 libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:android-native

      - name: Build ARM64 APK
        run: npm run android:build

      - name: Run Android ARM64 unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testArm64DebugUnitTest :tauri-plugin-aether-vpn:testDebugUnitTest --no-daemon

      - name: Verify and rename signed ARM64 APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -iname '*debug*' ! -iname '*unsigned*')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          node scripts/ci/verify-android-release.mjs "$apk"
          mkdir -p android-release
          cp "$apk" "android-release/Aether-GUI-v${RELEASE_VERSION}-android-arm64-signed.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: aether-android-arm64
          if-no-files-found: error
          path: android-release/Aether-GUI-v${{ env.RELEASE_VERSION }}-android-arm64-signed.apk

      - name: Clean temporary Android signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/aether-gui-android-release.jks"
          rm -f "$GITHUB_WORKSPACE/src-tauri/gen/android/keystore.properties"

  release:
    name: publish v0.7.2 release
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.7.2]')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Verify release version
        run: |
          node -e 'const p=require("./package.json"); if (p.version !== process.env.RELEASE_VERSION) { throw new Error(`package.json is ${p.version}, expected ${process.env.RELEASE_VERSION}`) }'
          grep -q '^version = "0.7.2"$' src-tauri/Cargo.toml
          grep -q '"version": "0.7.2"' src-tauri/tauri.conf.json

      - name: Replace release assets with current platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
          while IFS= read -r asset; do
            case "$asset" in
              SHA256SUMS.txt|*-unsigned.apk|Aether-GUI-v${RELEASE_VERSION}-android-arm64-signed.apk) ;;
              *) test -f "release/$asset" || { echo "Existing release asset was not preserved: $asset" >&2; exit 1; } ;;
            esac
          done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          find release -maxdepth 1 -type f \( -name 'aether-*' -o -name 'Aether-GUI-v*.apk' -o -name 'SHA256SUMS.txt' \) -delete
          while IFS= read -r -d '' file; do
            relative="${file#artifacts/}"
            artifact="${relative%%/*}"
            base="$(basename "$file")"
            case "$artifact" in
              aether-android-arm64)
                test "$base" = "Aether-GUI-v${RELEASE_VERSION}-android-arm64-signed.apk"
                cp "$file" "release/$base"
                ;;
              aether-linux-x86_64|aether-windows-x86_64|aether-macos-arm64|aether-macos-x86_64)
                cp "$file" "release/${artifact}-${base}"
                ;;
              *)
                echo "Unexpected workflow artifact: $file" >&2
                exit 1
                ;;
            esac
          done < <(find artifacts -mindepth 2 -type f -print0)
          signed="artifacts/aether-android-arm64/Aether-GUI-v${RELEASE_VERSION}-android-arm64-signed.apk"
          test -f "$signed"
          node scripts/ci/verify-android-release.mjs "$signed"
          desktop_count="$(find release -maxdepth 1 -type f \( -name 'aether-linux-*' -o -name 'aether-windows-*' -o -name 'aether-macos-*' \) | wc -l)"
          test "$desktop_count" -ge 5
          apk_count="$(find release -maxdepth 1 -type f -name "Aether-GUI-v${RELEASE_VERSION}-android-arm64-signed.apk" | wc -l)"
          test "$apk_count" -eq 1
          ! find release -maxdepth 1 -type f -iname '*unsigned*' | grep -q .
          (cd release && sha256sum * > SHA256SUMS.txt)
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Aether-GUI v0.7.2

          Cross-platform release built from the same validated `main` commit.

          ### Included platforms
          - Windows x86_64
          - Linux x86_64
          - macOS Apple Silicon (ARM64)
          - macOS Intel (x86_64)
          - Android ARM64 (`arm64-v8a`), signed with the permanent Aether-GUI release key

          ### Highlights
          - Updated to Aether core v1.5.0.
          - Bounded initial connection scans and one-time Turbo-to-Balanced fallback.
          - Stronger disconnect, shutdown, stale-retry, and process-tree cleanup.
          - Restored live-log controls with copy, clear, enable/disable, and line limits.
          - Removed ANSI and terminal-title control sequences from diagnostics.
          - Added practical DNS, Iran-direct, LAN-direct, and advertisement-blocking routing presets.
          - Fixed Android native-library packaging, VPN lifecycle behavior, and launcher icon parity.

          `SHA256SUMS.txt` is included for integrity verification.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          while IFS= read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -i 'unsigned.*\.apk$' || true)
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aether-GUI v$RELEASE_VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qi 'unsigned.*\.apk$'; then
            echo "Unsigned Android APK remains on the GitHub Release" >&2
            exit 1
          fi

  report:
    name: publish build result
    if: always()
    needs: [mark, desktop, android, release]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish aggregate commit status
        env:
          GH_TOKEN: ${{ github.token }}
          MARK_RESULT: ${{ needs.mark.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          state=success
          description='All desktop and Android builds completed'
          if [ "$RELEASE_RESULT" = success ]; then
            description='All builds completed and v0.7.2 was published'
          fi
          if [ "$MARK_RESULT" != success ] || [ "$DESKTOP_RESULT" != success ] || [ "$ANDROID_RESULT" != success ] || { [ "$RELEASE_RESULT" != success ] && [ "$RELEASE_RESULT" != skipped ]; }; then
            state=failure
            description="Build failed: mark=$MARK_RESULT desktop=$DESKTOP_RESULT android=$ANDROID_RESULT release=$RELEASE_RESULT"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=aether/build \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
