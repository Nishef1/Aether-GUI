name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mark:
    name: start platform build
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Mark platform build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=aether/build \
            -f description='Building desktop and Android artifacts' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  desktop:
    needs: mark
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            aether_asset: aether-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            aether_asset: aether-windows-x86_64.zip
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            aether_asset: aether-macos-arm64.tar.gz
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            aether_asset: aether-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=moderate

      - name: Fetch official Aether core
        if: runner.os != 'Windows'
        env:
          AETHER_ASSET: ${{ matrix.aether_asset }}
        run: bash src-tauri/binaries/fetch-aether.sh

      - name: Fetch official Aether core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "v1.5.0"
          $asset = "${{ matrix.aether_asset }}"
          $base = "https://github.com/CluvexStudio/Aether/releases/download/$version"
          Invoke-WebRequest "$base/$asset" -OutFile $asset
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          $line = Get-Content SHA256SUMS.txt | Where-Object { $_ -match [regex]::Escape($asset) } | Select-Object -First 1
          if (-not $line) { throw "Aether checksum entry was not found" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Aether checksum mismatch" }
          Expand-Archive $asset -DestinationPath aether-extract
          Copy-Item aether-extract/aether.exe src-tauri/binaries/aether.exe

      - name: Prepare pinned sing-box sidecar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:sidecars

      - name: TypeScript typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Android feature-parity contracts
        if: runner.os == 'Linux'
        run: python3 scripts/tests/test_android_feature_parity.py

      - name: Rust formatting check
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust unit tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build desktop bundle
        run: npm run tauri -- build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: aether-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*setup.exe

  android:
    needs: mark
    name: android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_MIN_API: 29
      NDK_VERSION: 28.2.13676358

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund

      - name: Initialize generated Android project
        run: npm run android:init

      - name: Prepare verified Aether and HEV ARM64 libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:android-native

      - name: Build ARM64 APK
        run: npm run android:build

      - name: Run Android unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew test --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: aether-android-arm64
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  report:
    name: publish build result
    if: always()
    needs: [mark, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish aggregate commit status
        env:
          GH_TOKEN: ${{ github.token }}
          MARK_RESULT: ${{ needs.mark.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          state=success
          description='All desktop and Android builds completed'
          if [ "$MARK_RESULT" != success ] || [ "$DESKTOP_RESULT" != success ] || [ "$ANDROID_RESULT" != success ]; then
            state=failure
            description="Build failed: mark=$MARK_RESULT desktop=$DESKTOP_RESULT android=$ANDROID_RESULT"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=aether/build \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
