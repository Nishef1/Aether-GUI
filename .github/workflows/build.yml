name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mark:
    name: start platform build
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
    steps:
      - name: Mark platform build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=aether/build \
            -f description='Building desktop, Debian, Arch and Android artifacts' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  desktop:
    needs: mark
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            aether_asset: aether-linux-x86_64-musl.tar.gz
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            aether_asset: aether-windows-x86_64.zip
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            aether_asset: aether-macos-arm64.tar.gz
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            aether_asset: aether-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libfuse2 librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - run: npm ci --no-audit --no-fund

      - name: Verify runtime version manifest
        run: npm run verify:runtimes

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=moderate

      - name: Fetch verified official Aether core
        env:
          AETHER_ASSET: ${{ matrix.aether_asset }}
        run: npm run prepare:aether

      - name: Prepare pinned sing-box sidecar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:sidecars

      - name: TypeScript typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Android feature-parity contracts
        if: runner.os == 'Linux'
        run: python3 scripts/tests/test_android_feature_parity.py

      - name: Rust formatting check
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust unit tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build desktop bundle
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Verify Linux release bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -e 'const v=require("./scripts/runtime-versions.json"); process.stdout.write(v.aether.version.slice(1))')"
          src-tauri/binaries/aether --version | grep -Fq "$expected"

          mapfile -t debs < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name '*.deb')
          mapfile -t appimages < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name '*.AppImage')
          test "${#debs[@]}" -ge 1
          test "${#appimages[@]}" -ge 1

          depends="$(dpkg-deb -f "${debs[0]}" Depends)"
          for required in 'libwebkit2gtk-4.1-0' 'libgtk-3-0' 'libayatana-appindicator3-1' 'pkexec'; do
            grep -Fq "$required" <<< "$depends" || { echo "Missing Debian dependency: $required" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: aether-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*setup.exe

  debian:
    needs: desktop
    name: debian-12-package-smoke
    runs-on: ubuntu-22.04
    container: debian:12
    timeout-minutes: 20
    steps:
      - name: Install package-test tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates file git jq

      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: aether-linux-x86_64
          path: /tmp/aether-linux

      - name: Install and verify Debian 12 package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find /tmp/aether-linux -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          apt-get install -y "$deb"

          gui="$(command -v aether-gui || true)"
          test -n "$gui"
          if ldd "$gui" | grep -q 'not found'; then
            ldd "$gui"
            exit 1
          fi

          core="$(find /usr -type f -path '*/binaries/aether' -print -quit 2>/dev/null)"
          test -x "$core"
          expected_core="$(jq -r '.aether.version | ltrimstr("v")' scripts/runtime-versions.json)"
          "$core" --version | grep -Fq "$expected_core"
          package_version="$(dpkg-deb -f "$deb" Version | sed 's/^[^:]*://')"
          echo "Debian package installed cleanly; package version=$package_version core=$core"

  arch:
    needs: mark
    name: arch-native-package
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    timeout-minutes: 75
    steps:
      - name: Install Arch build and runtime dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git curl wget file nodejs npm rust openssl librsvg xdotool patchelf \
            webkit2gtk-4.1 gtk3 libayatana-appindicator polkit
          useradd --create-home builder

      - uses: actions/checkout@v6

      - name: Build native pacman package from this exact commit
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/aether-arch-package
          mkdir -p "$work"
          awk -v source_path="$GITHUB_WORKSPACE" -v commit="$GITHUB_SHA" '
            /^source=\(/ { print "source=(\"Aether-GUI::git+file://" source_path "#commit=" commit "\")"; next }
            { print }
          ' packaging/arch/PKGBUILD > "$work/PKGBUILD"
          chown -R builder:builder "$work"
          chmod -R a+rX "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc "cd '$work' && makepkg --noconfirm --cleanbuild --force"
          mkdir -p "$GITHUB_WORKSPACE/arch-release"
          cp "$work"/*.pkg.tar.zst "$GITHUB_WORKSPACE/arch-release/"

      - name: Verify Arch package payload
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(find arch-release -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$pkg"
          root=/tmp/aether-arch-root
          mkdir -p "$root"
          bsdtar -xpf "$pkg" -C "$root"

          gui="$root/usr/bin/aether-gui"
          test -x "$gui"
          if ldd "$gui" | grep -q 'not found'; then
            ldd "$gui"
            exit 1
          fi

          core="$(find "$root" -type f -path '*/binaries/aether' -print -quit)"
          test -x "$core"
          expected="$(node -e 'const v=require("./scripts/runtime-versions.json"); process.stdout.write(v.aether.version.slice(1))')"
          "$core" --version | grep -Fq "$expected"

      - uses: actions/upload-artifact@v7
        with:
          name: aether-arch-x86_64
          if-no-files-found: error
          path: arch-release/*.pkg.tar.zst

  android:
    needs: mark
    name: android-arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      ANDROID_MIN_API: 29
      NDK_VERSION: 28.2.13676358

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and pinned NDK
        run: |
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund

      - name: Verify runtime version manifest
        run: npm run verify:runtimes

      - name: Initialize generated Android project
        run: npm run android:init

      - name: Validate Android release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required Android release signing secret: $name" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          done

      - name: Configure temporary Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/ci/configure-android-release-signing.mjs

      - name: Prepare verified Aether and HEV ARM64 libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:android-native

      - name: Verify Android native runtime stamp
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const versions = require("./scripts/runtime-versions.json");
          const stamp = JSON.parse(fs.readFileSync("src-tauri/plugins/aether-vpn/android/.native-versions.json", "utf8"));
          if (stamp.aether !== versions.aether.version) throw new Error(`Android core ${stamp.aether} != ${versions.aether.version}`);
          if (stamp.aether_commit !== versions.aether.commit) throw new Error("Android core commit mismatch");
          if (stamp.hev !== versions.hev.version) throw new Error(`Android HEV ${stamp.hev} != ${versions.hev.version}`);
          NODE

      - name: Build ARM64 APK
        run: npm run android:build

      - name: Run Android ARM64 unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testArm64DebugUnitTest :tauri-plugin-aether-vpn:testDebugUnitTest --no-daemon

      - name: Verify and rename signed ARM64 APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -iname '*debug*' ! -iname '*unsigned*')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          node scripts/ci/verify-android-release.mjs "$apk"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir -p android-release
          cp "$apk" "android-release/Aether-GUI-v${version}-android-arm64-signed.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: aether-android-arm64
          if-no-files-found: error
          path: android-release/Aether-GUI-v*-android-arm64-signed.apk

      - name: Clean temporary Android signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/aether-gui-android-release.jks"
          rm -f "$GITHUB_WORKSPACE/src-tauri/gen/android/keystore.properties"

  report:
    name: publish build result
    if: always()
    needs: [mark, desktop, debian, arch, android]
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
    steps:
      - name: Publish aggregate commit status
        env:
          GH_TOKEN: ${{ github.token }}
          MARK_RESULT: ${{ needs.mark.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DEBIAN_RESULT: ${{ needs.debian.result }}
          ARCH_RESULT: ${{ needs.arch.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          state=success
          description='All desktop, Debian, Arch and Android builds completed'
          if [ "$MARK_RESULT" != success ] || [ "$DESKTOP_RESULT" != success ] || [ "$DEBIAN_RESULT" != success ] || [ "$ARCH_RESULT" != success ] || [ "$ANDROID_RESULT" != success ]; then
            state=failure
            description="Build failed: desktop=$DESKTOP_RESULT debian=$DEBIAN_RESULT arch=$ARCH_RESULT android=$ANDROID_RESULT"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=aether/build \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
