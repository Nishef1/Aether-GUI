name: Apply Android WireGuard policy once

on:
  push:
    branches:
      - main
    paths:
      - ".github/android-wireguard-apply"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify WireGuard hardening
        run: |
          set -euo pipefail
          python3 scripts/ci/apply-android-wireguard-policy.py
          python3 scripts/tests/test_android_wireguard_contract.py
          python3 scripts/tests/test_android_plugin_contract.py

      - name: Commit policy wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/plugins/aether-vpn/android/src/main/java/FinalAetherVpnPlugin.kt \
            scripts/ci/test-android-plugin-kotlin.sh
          git commit -m "fix(android): harden WireGuard startup and MTU"
          git push origin HEAD:main

      - name: Dispatch Android build and record it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-android-arm64.yml --repo "${GITHUB_REPOSITORY}" --ref main
          sleep 10
          gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow build-android-arm64.yml \
            --limit 1 \
            --json databaseId,url,status,conclusion,headSha,createdAt \
            > .github/android-wireguard-build.json
          git add .github/android-wireguard-build.json
          git commit -m "ci(android): record WireGuard hardening build"
          git push origin HEAD:main
