name: Build macOS ARM preview once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-macos-arm-preview-once.yml

permissions:
  contents: write
  statuses: write

env:
  PREVIEW_TAG: preview-v0.5.2-multiplatform

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark ARM build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context='preview/macos-arm64' \
            -f description='Building unsigned macOS ARM64 preview' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          brew install llvm cmake nasm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Build and stage pinned Aether fork
        run: |
          set -euo pipefail
          cargo build --release --manifest-path vendor/aether/aether/Cargo.toml
          source_binary="vendor/aether/aether/target/release/aether"
          test -s "$source_binary"
          commit="$(git -C vendor/aether rev-parse --short=12 HEAD)"
          version="dev-$commit"
          mkdir -p src-tauri/binaries
          rm -f src-tauri/binaries/aether src-tauri/binaries/aether-dev-*
          install -m 0755 "$source_binary" "src-tauri/binaries/aether-$version"
          cp "src-tauri/binaries/aether-$version" src-tauri/binaries/aether
          chmod 0755 src-tauri/binaries/aether
          printf '%s' "$version" > src-tauri/binaries/aether-version.txt

      - name: Capture disk state before core installers
        if: always()
        run: |
          {
            echo '=== df before installers ==='
            df -h
            echo '=== Aether target size ==='
            du -sh vendor/aether/aether/target 2>/dev/null || true
            echo '=== binaries directory ==='
            ls -lah src-tauri/binaries
          } | tee macos-arm-diagnostics.log

      - name: Fetch sing-box with captured output
        id: singbox
        continue-on-error: true
        run: |
          set -o pipefail
          bash -x src-tauri/binaries/fetch-singbox.sh --version v1.13.14 2>&1 | tee -a macos-arm-diagnostics.log

      - name: Capture disk state after sing-box
        if: always()
        run: |
          {
            echo '=== df after sing-box ==='
            df -h
            echo '=== binaries after sing-box ==='
            ls -lah src-tauri/binaries
          } | tee -a macos-arm-diagnostics.log

      - name: Fetch Xray with captured output
        id: xray
        if: steps.singbox.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bash -x src-tauri/binaries/fetch-xray.sh --version v26.6.1 2>&1 | tee -a macos-arm-diagnostics.log

      - name: Upload core installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-core-installer-diagnostics
          retention-days: 14
          if-no-files-found: error
          path: macos-arm-diagnostics.log

      - name: Fail after preserving installer diagnostics
        if: steps.singbox.outcome == 'failure' || steps.xray.outcome == 'failure'
        run: exit 1

      - name: Verify downloaded core architectures
        run: file src-tauri/binaries/aether src-tauri/binaries/sing-box src-tauri/binaries/xray

      - name: Build ad-hoc signed DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --bundles dmg --config src-tauri/tauri.conf.unsigned.json

      - name: Create checksum
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"
          dmg="$(find "$bundle_dir/dmg" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          shasum -a 256 "$dmg" | awk '{print $1 "  " substr($0, index($0,$2))}' > "$bundle_dir/aether-gui-macos-arm64-SHA256SUMS.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-gui-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/aether-gui-macos-arm64-SHA256SUMS.txt

      - name: Publish preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$PREVIEW_TAG" \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/aether-gui-macos-arm64-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Mark ARM build success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context='preview/macos-arm64' \
            -f description='Unsigned macOS ARM64 preview is ready' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$PREVIEW_TAG"

      - name: Mark ARM build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure -f context='preview/macos-arm64' \
            -f description='Unsigned macOS ARM64 preview failed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
