name: Diagnose macOS ARM core downloads

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-macos-arm-cores.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Mark diagnostic pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context='preview/macos-arm-core-diagnostic' \
            -f description='Checking macOS ARM core downloads' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fetch sing-box ARM core
        run: bash src-tauri/binaries/fetch-singbox.sh --version v1.13.14

      - name: Fetch Xray ARM core
        run: bash src-tauri/binaries/fetch-xray.sh --version v26.6.1

      - name: Verify downloaded architectures
        run: file src-tauri/binaries/sing-box src-tauri/binaries/xray

      - name: Mark diagnostic success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context='preview/macos-arm-core-diagnostic' \
            -f description='macOS ARM core downloads are valid' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Mark diagnostic failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure -f context='preview/macos-arm-core-diagnostic' \
            -f description='A macOS ARM core download failed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
