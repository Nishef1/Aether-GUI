name: Dispatch Android APK once

on:
  push:
    branches:
      - main
    paths:
      - ".github/android-build-dispatch"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch manual Android workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-android-arm64.yml --repo "${GITHUB_REPOSITORY}" --ref main
